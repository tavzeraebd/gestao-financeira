<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#fafafa;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">
      <tr><td style="padding:32px;">
        <p style="margin:0 0 16px;font-size:20px;font-weight:bold;">Núcleo</p>
        <h1 style="margin:0 0 12px;font-size:18px;">Confirme seu e-mail</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.5;">Falta pouco para sua família ter o dinheiro sob controle. Clique no botão abaixo para confirmar seu e-mail e ativar sua conta.</p>
        <p style="margin:0 0 24px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email{{ if .Data.next_path }}&next={{ .Data.next_path }}{{ end }}" style="display:inline-block;padding:12px 20px;background:#84cc16;color:#1a2e05;text-decoration:none;font-weight:bold;border-radius:8px;">Confirmar e-mail</a></p>
        <p style="margin:0;font-size:12px;line-height:1.5;color:#52525b;">Se você não criou uma conta no Núcleo, ignore esta mensagem.</p>
      </td></tr>
    </table>
  </body>
</html>
