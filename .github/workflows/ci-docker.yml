# CI com Docker (ADR-0039): Supabase local, pgTAP, lint do banco, integração e E2E completo.
# Roda à mão (workflow_dispatch), em push na main e, se a variável do repositório CI_DOCKER for
# "true", também em pull_request do próprio repositório. Só usa as chaves do Supabase LOCAL
# (`supabase status`), mascaradas no log. Nenhum segredo do repositório além do GITHUB_TOKEN.
# Nunca roda migrations em produção: elas são manuais (docs/runbooks/migracoes-producao.md).
name: CI Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banco-e-e2e:
    name: Banco, integração e E2E completo
    # Em PR só liga com a variável CI_DOCKER = "true"; em dispatch e push na main sempre roda.
    if: github.event_name != 'pull_request' || vars.CI_DOCKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_URL: http://localhost:3000
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0

      - name: Subir o Supabase local
        run: pnpm db:start
        timeout-minutes: 15

      - name: Recriar o banco a partir das migrations e do seed
        run: pnpm db:reset
        timeout-minutes: 10

      - name: Exportar URL e chaves do Supabase local
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          valor() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' || true; }
          url="$(valor API_URL)"
          publishable="$(valor PUBLISHABLE_KEY)"
          [ -n "$publishable" ] || publishable="$(valor ANON_KEY)"
          secret="$(valor SECRET_KEY)"
          [ -n "$secret" ] || secret="$(valor SERVICE_ROLE_KEY)"
          if [ -z "$url" ] || [ -z "$publishable" ] || [ -z "$secret" ]; then
            echo "::error::supabase status -o env não trouxe API_URL, chave publicável e chave secreta"
            exit 1
          fi
          echo "::add-mask::$publishable"
          echo "::add-mask::$secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supabase.env"

      - name: Lint do banco
        run: pnpm db:lint

      - name: Testes pgTAP
        run: pnpm db:test

      # TEMPORÁRIO: o diff contra o arquivo versionado ainda pode falhar enquanto src/types/database.ts
      # não for substituído pelo gerado no CI. Quando isso acontecer, remova o continue-on-error.
      - name: Tipos do banco em dia
        continue-on-error: true
        run: |
          pnpm db:types
          # src/types/database.ts está em .prettierignore; um ignore vazio força a formatação do arquivo gerado.
          : > "$RUNNER_TEMP/sem-ignore"
          pnpm exec prettier --write --ignore-path "$RUNNER_TEMP/sem-ignore" src/types/database.ts
          git diff --exit-code -- src/types/database.ts

      - name: Upload dos tipos gerados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tipos-gerados
          path: src/types/database.ts
          if-no-files-found: error

      - name: Testes de integração
        run: pnpm test:integration
        timeout-minutes: 20

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      # O playwright.config.ts faz o build e sobe o app em localhost:3000 (site_url do Supabase local).
      - name: E2E completo
        run: pnpm test:e2e
        timeout-minutes: 45

      - name: Relatórios do Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-relatorios
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnóstico dos containers
        if: failure()
        run: docker ps -a
